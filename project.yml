name: Wietty
options:
  bundleIdPrefix: eu.kloosterman
  deploymentTarget:
    macOS: "14.0"
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: "2.25.0"
  HummingbirdWebSocket:
    url: https://github.com/hummingbird-project/hummingbird-websocket
    from: "2.2.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  WiettyShared:
    url: https://github.com/kloostermanw/wietty-shared
    from: "0.4.1"
  # The libghostty embedding API is explicitly unstable: pin exactly, never a range.
  #
  # Unconditional on the app target on purpose, even though it is the largest
  # dependency here by far (a 52 MB release asset, 127 MB unpacked in
  # SourcePackages, a 39 MB static macOS slice). The substrate is chosen at
  # runtime from a setting read at launch, so a shipped build has to contain
  # libghostty whichever substrate a given user picked: gating it behind a build
  # configuration cannot make the shipped app smaller, it can only produce a
  # second product that silently lacks a documented feature. It would also stop
  # the default build from compiling GhosttySurfaceHost.swift, which is the one
  # adapter onto an unstable pinned C API and therefore the last thing that
  # should be allowed to drift uncompiled.
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: "1.3.2"
targets:
  Wietty:
    type: application
    platform: macOS
    sources: [Wietty]
    dependencies:
      - package: MCP
        product: MCP
      - package: Hummingbird
        product: Hummingbird
      - package: HummingbirdWebSocket
        product: HummingbirdWebSocket
      - package: SwiftTerm
        product: SwiftTerm
      - package: WiettyShared
        product: WiettyShared
      - package: GhosttyKit
        product: GhosttyKit
      - target: wietty-pty
        # XcodeGen only emits the `copy` Copy Files phase for a dependency when
        # `embed` is true (see Docs/ProjectSpec.md); with `embed: false` the
        # `copy` block below is silently ignored and nothing lands in the app
        # bundle at all. `embed: true` here means "run a Copy Files phase for
        # this dependency", not "add it to Embed Frameworks": the phase's own
        # destination is what the `copy` block sets, to `executables`, which is
        # `Contents/MacOS` for an app bundle.
        embed: true
        codeSign: false
        copy:
          destination: executables
    postCompileScripts:
      # Compile the bundled xterm-ghostty terminfo. Wietty renders with
      # libghostty, so the truthful TERM is xterm-ghostty, but that name is only
      # usable if the entry exists in a database the child shell can read, and
      # this app deliberately does not require Ghostty.app to install one. So the
      # entry travels in the bundle: tic writes it into Contents/Resources/terminfo
      # (a hashed layout, e.g. 78/xterm-ghostty), BundledTerminfo finds it there
      # and points spawned shells at it with TERMINFO_DIRS. Runs before the
      # implicit code signing, so the compiled entry is sealed with the bundle.
      # See docs/terminal.md and docs/notifications.md.
      - name: Compile xterm-ghostty terminfo
        script: |
          set -euo pipefail
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/terminfo"
          mkdir -p "$DEST"
          /usr/bin/tic -x -o "$DEST" "${SRCROOT}/terminfo/xterm-ghostty.terminfo"
        inputFiles:
          - $(SRCROOT)/terminfo/xterm-ghostty.terminfo
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/terminfo/78/xterm-ghostty
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/terminfo/67/ghostty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kloosterman.wietty
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.9"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Ad hoc signed, and signed at all, which is not the same thing as the
        # `CODE_SIGNING_ALLOWED: NO` this used to say. That produced a bundle whose
        # Mach-O carried a linker signature and whose bundle carried none: the
        # signing identifier was "Wietty" rather than the bundle id, the Info.plist
        # was not bound, and nothing was sealed. macOS refuses to ask for
        # notification permission for such a bundle, turning the request down in
        # about a millisecond with `UNErrorDomain Code=1` and no prompt, so bells
        # and OSC 9 notifications could never work in a shipped build. No developer
        # account is involved: "-" is the ad hoc identity, and it is enough.
        # See docs/notifications.md.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
  # The helper libghostty surfaces run as their command (Task 7 of the
  # libghostty substrate work). See wietty-pty/main.swift for why it exists.
  wietty-pty:
    type: tool
    platform: macOS
    sources: [wietty-pty]
    settings:
      base:
        PRODUCT_NAME: wietty-pty
        SWIFT_VERSION: "6.0"
        # Signed for the same reason, and it has to be: an unsigned executable
        # inside a signed bundle breaks the seal on the bundle that contains it.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
  WiettyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WiettyTests]
    dependencies:
      - target: Wietty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kloosterman.wiettyTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  Wietty:
    build:
      targets:
        Wietty: all
        wietty-pty: all
        WiettyTests: [test]
    test:
      targets:
        - WiettyTests
