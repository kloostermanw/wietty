name: Wietty
options:
  bundleIdPrefix: eu.kloosterman
  deploymentTarget:
    macOS: "14.0"
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: "2.25.0"
  HummingbirdWebSocket:
    url: https://github.com/hummingbird-project/hummingbird-websocket
    from: "2.2.0"
  # Exact, not a floor: the package defines the wire format. 1.0.0 brought terminal
  # stream protocol version 2, which this app serves and the iPad has to speak too.
  # 1.1.0 adds, with no change on the wire, what the local socket server needs from
  # the codec (`StreamFrameReader.failure`, `StreamCodec.checkedSocketFrame`).
  WiettyShared:
    url: https://github.com/kloostermanw/wietty-shared
    exactVersion: "1.1.0"
  # The libghostty embedding API is explicitly unstable: pin exactly, never a range.
  #
  # Unconditional on the app target on purpose, even though it is the largest
  # dependency here by far (a 52 MB release asset, 127 MB unpacked in
  # SourcePackages, a 39 MB static macOS slice). The substrate is chosen at
  # runtime from a setting read at launch, so a shipped build has to contain
  # libghostty whichever substrate a given user picked: gating it behind a build
  # configuration cannot make the shipped app smaller, it can only produce a
  # second product that silently lacks a documented feature. It would also stop
  # the default build from compiling GhosttySurfaceHost.swift, which is the one
  # adapter onto an unstable pinned C API and therefore the last thing that
  # should be allowed to drift uncompiled.
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: "1.3.2"
  # libghostty-vt: Ghostty's terminal emulation without a renderer or a window,
  # which is what lets the core hold a terminal's state with no surface behind it.
  #
  # A local wrapper package rather than a remote one, because upstream publishes
  # a bare xcframework zip (on release.files.ghostty.org, not as a GitHub release)
  # and no Swift package. The wrapper holds a manifest and nothing else, so the
  # 16 MB archive is fetched on first resolve and never enters the repository.
  #
  # Pinned exactly, and the pin is the sha256 in Packages/GhosttyVt/Package.swift
  # rather than a version here: a local package has no version to state. The C ABI
  # is stable from 1.0, but the snapshot byte format is versioned separately and
  # is not covered by that promise, so moving to a new release means changing the
  # url and the checksum together, on purpose.
  #
  # A dependency of WiettyCore only. The archive holds static libraries, so the
  # framework links it and nothing is embedded. It shares several hundred symbols
  # with GhosttyKit (simdutf, Highway, compiler builtins) and none of its API;
  # the two never meet in one image, because GhosttyKit is linked into the app
  # and this into the framework. scripts/coexistence-check.sh is the proof that
  # both can be live in one process.
  GhosttyVt:
    path: Packages/GhosttyVt
targets:
  # Everything Wietty does that needs no window: the store, the terminal byte path,
  # the supervisors and the servers. A target of its own so the compiler refuses an
  # import of SwiftUI or AppKit on this side of the boundary. See issue #84.
  #
  # The three targets share SWIFT_PACKAGE_NAME so that `package` declarations reach
  # the app and the tests while nothing else sees them. Without that, every member a
  # view touches would have to be `public`, which turns an internal refactor into a
  # published API, and every test reaching internal state would need a second
  # `@testable` import.
  WiettyCore:
    type: framework
    platform: macOS
    sources: [WiettyCore]
    dependencies:
      - package: MCP
        product: MCP
      - package: Hummingbird
        product: Hummingbird
      - package: HummingbirdWebSocket
        product: HummingbirdWebSocket
      - package: GhosttyVt
        product: GhosttyVt
      # The stream's message type, StreamMessage, which the server queues and writes.
      # The app links the package too, for the controlling side.
      - package: WiettyShared
        product: WiettyShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kloosterman.WiettyCore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_PACKAGE_NAME: wietty
        # Signed for the reason the helper is: an unsigned binary inside a signed
        # bundle breaks the seal on the bundle that contains it.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
      # A Release build is what `scripts/make-dmg.sh` ships, and Gatekeeper accepts only
      # a Developer ID signature that Apple has notarized. So Release is signed with the
      # Developer ID certificate of the team below, with the hardened runtime and a secure
      # timestamp, both of which notarization requires. Debug keeps the ad hoc identity
      # from `base`, so an ordinary build and the test suite need no certificate. Without
      # the certificate a Release build still works with the identity overridden on the
      # command line: see docs/releasing.md.
      #
      # Injecting the base entitlements is off because that is where `get-task-allow`
      # comes from, and a notarized binary may not carry it.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: FP5KVVVJLP
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  Wietty:
    type: application
    platform: macOS
    sources: [Wietty]
    dependencies:
      - target: WiettyCore
      - package: WiettyShared
        product: WiettyShared
      - package: GhosttyKit
        product: GhosttyKit
      - target: wietty-pty
        # XcodeGen only emits the `copy` Copy Files phase for a dependency when
        # `embed` is true (see Docs/ProjectSpec.md); with `embed: false` the
        # `copy` block below is silently ignored and nothing lands in the app
        # bundle at all. `embed: true` here means "run a Copy Files phase for
        # this dependency", not "add it to Embed Frameworks": the phase's own
        # destination is what the `copy` block sets, to `executables`, which is
        # `Contents/MacOS` for an app bundle.
        embed: true
        codeSign: false
        copy:
          destination: executables
    postCompileScripts:
      # Compile the bundled xterm-ghostty terminfo. Wietty renders with
      # libghostty, so the truthful TERM is xterm-ghostty, but that name is only
      # usable if the entry exists in a database the child shell can read, and
      # this app deliberately does not require Ghostty.app to install one. So the
      # entry travels in the bundle: tic writes it into Contents/Resources/terminfo
      # (a hashed layout, e.g. 78/xterm-ghostty), BundledTerminfo finds it there
      # and points spawned shells at it with TERMINFO_DIRS. Runs before the
      # implicit code signing, so the compiled entry is sealed with the bundle.
      # See docs/terminal.md and docs/notifications.md.
      - name: Compile xterm-ghostty terminfo
        script: |
          set -euo pipefail
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/terminfo"
          mkdir -p "$DEST"
          /usr/bin/tic -x -o "$DEST" "${SRCROOT}/terminfo/xterm-ghostty.terminfo"
        inputFiles:
          - $(SRCROOT)/terminfo/xterm-ghostty.terminfo
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/terminfo/78/xterm-ghostty
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/terminfo/67/ghostty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kloosterman.wietty
        SWIFT_PACKAGE_NAME: wietty
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.19"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Ad hoc signed, and signed at all, which is not the same thing as the
        # `CODE_SIGNING_ALLOWED: NO` this used to say. That produced a bundle whose
        # Mach-O carried a linker signature and whose bundle carried none: the
        # signing identifier was "Wietty" rather than the bundle id, the Info.plist
        # was not bound, and nothing was sealed. macOS refuses to ask for
        # notification permission for such a bundle, turning the request down in
        # about a millisecond with `UNErrorDomain Code=1` and no prompt, so bells
        # and OSC 9 notifications could never work in a shipped build. "-" is the ad hoc
        # identity, and it is enough for that. A Release build is signed with
        # Developer ID instead, in `configs` below.
        # See docs/notifications.md.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
      # Developer ID for Release, as on WiettyCore above.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: FP5KVVVJLP
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  # The helper libghostty surfaces run as their command (Task 7 of the
  # libghostty substrate work). See wietty-pty/main.swift for why it exists.
  wietty-pty:
    type: tool
    platform: macOS
    sources: [wietty-pty]
    settings:
      base:
        PRODUCT_NAME: wietty-pty
        SWIFT_VERSION: "6.0"
        # Signed for the same reason, and it has to be: an unsigned executable
        # inside a signed bundle breaks the seal on the bundle that contains it.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
      # Developer ID for Release, as on WiettyCore above.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: FP5KVVVJLP
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  WiettyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WiettyTests]
    dependencies:
      - target: Wietty
      # Linked, not embedded: the host app embeds the framework and the test bundle
      # is loaded into it, so a second copy here would be a second module at runtime.
      - target: WiettyCore
        embed: false
      # WiettyShared is the exception, and has to be declared. It is linked into both
      # WiettyCore and the app, so SwiftPM builds it as a dynamic product framework,
      # which the app embeds. The tests used to find its symbols in the app's binary,
      # where it was linked statically; now they have to link the framework. Xcode
      # still copies it into the test bundle, `embed: false` notwithstanding, but every
      # copy has one install name and dyld loads a single image of it.
      # WiettySharedImageTests fails if that ever stops being true.
      - package: WiettyShared
        product: WiettyShared
        embed: false
      # MCP and HTTPTypes are NOT re-declared here, although MCPServerHostTests and
      # RemoteActivateTests import them. Linking a package product into both
      # WiettyCore and a second target makes SwiftPM build dynamic product
      # frameworks that fail to link (WSCore and NIOTransportServices, undefined
      # Logging.Logger). WiettyCore links them, its build puts their modules in the
      # shared products directory for the compiler to find, and the test bundle is
      # loaded into a host that already has the framework.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.kloosterman.wiettyTests
        SWIFT_PACKAGE_NAME: wietty
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  Wietty:
    build:
      targets:
        WiettyCore: all
        Wietty: all
        wietty-pty: all
        WiettyTests: [test]
    test:
      targets:
        - WiettyTests
